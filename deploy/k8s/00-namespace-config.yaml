apiVersion: v1
kind: Namespace
metadata:
  name: finflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finflow-config
  namespace: finflow
data:
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_ALLOWED_HOSTS: "*"
  DJANGO_SECURE_SSL_REDIRECT: "True"
  STORAGE_BACKEND: s3
  AWS_STORAGE_BUCKET_NAME: finflow-documents
  AWS_S3_REGION_NAME: us-east-1
  AWS_S3_ADDRESSING_STYLE: path
  GROUP_CONSOLIDATION_CURRENCY: XOF
  SEED_DEMO: "0"
  DB_CONN_MAX_AGE: "0"
  REPORTING_SNAPSHOT_MAX_AGE_SECONDS: "3600"
  AUDIT_RETENTION_DAYS: "365"
---
# Remplacer par ExternalSecrets / sealed-secrets en production.
apiVersion: v1
kind: Secret
metadata:
  name: finflow-secrets
  namespace: finflow
type: Opaque
stringData:
  DJANGO_SECRET_KEY: change-me
  DATABASE_URL: postgres://finflow:finflow@postgres:5432/finflow
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  REDIS_CACHE_URL: redis://redis:6379/2
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_S3_ENDPOINT_URL: http://minio:9000
  SENTRY_DSN: ""
