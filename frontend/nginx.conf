server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # Assets versionnés (hash dans le nom) : cache long et immuable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html jamais mis en cache : garantit le chargement du dernier bundle
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # SPA : toutes les routes inconnues renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API, admin Django natif, static/media (proxy vers le backend)
    # /admin/* reste pour la SPA React — ne pas le proxifier ici.
    location ~ ^/(api|django-admin|static|media)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tests SMTP / uploads : éviter un 504 HTML opaque côté navigateur
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
