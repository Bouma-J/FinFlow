[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
addopts = -q
# La suite de tests vit exclusivement dans `tests/`. `scripts/` contient des
# utilitaires de vérification manuelle (exécutés à la main, serveur démarré) :
# ils ne doivent jamais être collectés, sous peine d'interrompre toute la suite.
testpaths = tests
norecursedirs = scripts .git __pycache__ node_modules *.egg
