name: finflow

# =========================================================================
# FIN_FLOW — orchestration complète (dev/démo)
# Lancement : docker compose up --build
#   Frontend : http://localhost:8080  (évite le conflit avec Nginx hôte sur :80)
#   API      : http://localhost:8080/api/v1/  •  Docs : …/api/docs/
#   Admin SPA: http://localhost:8080/admin/filiales
#   Admin DJ : http://localhost:8080/django-admin/
#   MinIO    : http://localhost:9001 (console)
# =========================================================================

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
  DJANGO_SECURE_SSL_REDIRECT: "False"
  DJANGO_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:8080,http://localhost:5173
  DATABASE_URL: postgres://finflow:finflow@db:5432/finflow
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DB_CONN_MAX_AGE: "60"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  GROUP_CONSOLIDATION_CURRENCY: XOF
  SEED_DEMO: ${SEED_DEMO:-0}
  # GED → MinIO (S3)
  STORAGE_BACKEND: s3
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  AWS_STORAGE_BUCKET_NAME: finflow-documents
  AWS_S3_ENDPOINT_URL: http://minio:9000
  AWS_S3_CUSTOM_DOMAIN: localhost:9000
  AWS_S3_REGION_NAME: us-east-1
  AWS_S3_ADDRESSING_STYLE: path
  AWS_S3_URL_PROTOCOL: "http:"
  AWS_QUERYSTRING_AUTH: "True"
  # E-mail : console par défaut. Pour Gmail, définir ces variables dans
  # un fichier `.env` à la racine (voir backend/.env.example section Gmail).
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-FIN_FLOW <noreply@finflow.local>}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
  # 0 en démo Windows (Avast Mail Shield → CERTIFICATE_VERIFY_FAILED).
  # En production Ubuntu : forcer SMTP_SSL_VERIFY=1.
  SMTP_SSL_VERIFY: ${SMTP_SSL_VERIFY:-0}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finflow
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Bind loopback : compatible avec Nginx hôte + surcharge prod.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      <<: *backend-env
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A config worker -l info
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  beat:
    build: ./backend
    command: celery -A config beat -l info
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # :8080 — le port 80 de l'hôte est réservé à Nginx/Certbot en prod.
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  media:
  staticfiles:
