# =========================================================================
# FIN_FLOW — surcharge accès par IP (HTTP, sans domaine / TLS)
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.ip.yml up -d --build
#
# Expose MinIO sur toutes les interfaces (:9000) pour les URLs présignées
# du navigateur (AWS_S3_CUSTOM_DOMAIN=<IP>:9000).
# =========================================================================

services:
  minio:
    ports: !override
      - "9000:9000"
      # Console : rester en local / tunnel SSH
      - "127.0.0.1:9001:9001"
